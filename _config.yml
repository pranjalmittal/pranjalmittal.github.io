###########
# site.title

title: Pranjal Mittal
description: Software Architect: high-scale backend platforms, distributed systems, cloud infrastructure, AI.
url: "https://pranjalmittal.github.io"
# baseurl: "/jekyllBear" # the subpath of your site, e.g. /blog/

theme: jekyll-bear-theme

#########################
# more settings

plugins:
  - jekyll-redirect-from

whitelist:
  - jekyll-redirect-from

markdown: kramdown

compress_html:
  clippings: all
  comments: [""]
  endings: [html, head, body, li, dt, dd, rt, rp, optgroup, option, colgroup, caption, thead, tbody, tfoot, tr, td, th]
  profile: false
  blanklines: false
  ignore:
    envs: []

collections:
  my_tags:
    output: true
    permalink: /tagged/:slug/
defaults:
  -
    scope:
      path: ""
      type: my_tags
    values:
      layout: tagged

permalink: /blog/:slug
timezone: Asia/Kolkata
future: false

exclude:
- README.md
- LICENSE.md

exclude: [vendor]

Blog: /blog
Life: /life

# Add general links to site pages here
links:
  # Resume: /assets/resume.pdf

# Add links for more focus here
special_links:
  "GitHub": https://github.com/pranjalmittal
  "LinkedIn": https://www.linkedin.com/in/mittalpranjal/
